name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Regenerate the reference
        env:
          XDG_DATA_HOME: ""
          ATB_DATA_DIR: ""
          ATB_DATADIR: ""
        run: make docs

      - name: Fail if the generated reference is stale
        run: |
          generated="docs/reference/cli docs/reference/columns.md"
          if ! git diff --quiet -- $generated; then
            echo "::error::$generated is out of date. Run 'make docs' and commit the result."
            git --no-pager diff -- $generated
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build the site (strict)
        run: mkdocs build --strict
