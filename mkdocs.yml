site_name: atb-cli
site_description: Query and download AllTheBacteria genomes from the command line
site_url: https://atb-cli.readthedocs.io/
repo_url: https://github.com/AllTheBacteria/atb-cli
repo_name: AllTheBacteria/atb-cli
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

exclude_docs: |
  superpowers/
  comparison-with-codex.md
  deployment.md
  BENCHMARKS.md

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Updating: getting-started/updating.md
  - Guides:
      - Querying genomes: guides/query.md
      - AMR genes: guides/amr.md
      - MLST: guides/mlst.md
      - Finding closest genomes: guides/sketch.md
      - Downloading assemblies: guides/download.md
      - Browsing OSF files: guides/osf.md
  - Reference:
      - CLI commands: reference/cli/
